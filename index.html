
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>My Birthday Countdown 🎀</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Georgia, "Times New Roman", serif;
      background: #f4e6d7;
    }

    .birthday-section {
      min-height: 100vh;
      position: relative;
      overflow: hidden;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 60px 20px;

      background:
        radial-gradient(circle at 15% 20%, rgba(255, 143, 177, 0.35), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(255, 190, 210, 0.45), transparent 28%),
        linear-gradient(135deg, #f8eadb, #f3c8d5, #f8e8d8);
    }

    .circle {
      position: absolute;
      border-radius: 50%;
      filter: blur(2px);
      opacity: 0.5;
    }

    .circle.one {
      width: 230px;
      height: 230px;
      background: #e889a9;
      top: -80px;
      left: -70px;
    }

    .circle.two {
      width: 300px;
      height: 300px;
      background: #f6b7c9;
      right: -100px;
      bottom: -100px;
    }

    .circle.three {
      width: 120px;
      height: 120px;
      background: #fff;
      right: 12%;
      top: 10%;
      opacity: 0.35;
    }

    .birthday-card {
      width: min(950px, 100%);
      position: relative;
      z-index: 2;

      padding: 65px 45px;
      text-align: center;

      background: rgba(255, 247, 239, 0.78);
      border: 2px solid rgba(255, 255, 255, 0.7);
      border-radius: 35px;

      box-shadow:
        0 30px 80px rgba(160, 77, 103, 0.20),
        inset 0 0 30px rgba(255, 255, 255, 0.35);

      backdrop-filter: blur(15px);
    }

    .small-title {
      color: #a94f70;
      font-family: Arial, sans-serif;
      font-size: 14px;
      font-weight: 800;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .birthday-card h1 {
      color: #8f3157;
      font-size: clamp(3rem, 8vw, 7rem);
      line-height: 0.95;
      font-weight: 900;
      letter-spacing: -4px;
      margin-bottom: 20px;
      text-shadow: 3px 4px 0 rgba(255, 255, 255, 0.8);
    }

    .birthday-card h1 span {
      color: #d85d89;
    }

    .date {
      color: #704653;
      font-family: Arial, sans-serif;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: 3px;
      margin-bottom: 45px;
    }

    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 18px;
      max-width: 780px;
      margin: auto;
    }

    .time-box {
      min-height: 145px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      background: linear-gradient(145deg, #fff7f1, #f7d1dc);
      border: 2px solid rgba(216, 93, 137, 0.2);
      border-radius: 25px;

      box-shadow: 0 15px 30px rgba(164, 73, 103, 0.12);
    }

    .time-box span {
      color: #8f3157;
      font-family: Arial, sans-serif;
      font-size: clamp(2.2rem, 5vw, 4rem);
      font-weight: 900;
      line-height: 1;
    }

    .time-box small {
      color: #a75a73;
      font-family: Arial, sans-serif;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-top: 12px;
    }

    .message {
      margin-top: 40px;
      color: #754858;
      font-size: 20px;
      font-style: italic;
    }

    .heart {
      display: inline-block;
      color: #d85d89;
      animation: heartbeat 1.4s infinite;
    }

    /* Floating hearts */

    .floating-heart {
      position: absolute;
      color: #d85d89;
      font-size: 25px;
      opacity: 0.55;
      animation: float 5s ease-in-out infinite;
    }

    .heart-one {
      top: 18%;
      left: 8%;
    }

    .heart-two {
      bottom: 18%;
      left: 15%;
      animation-delay: 1s;
    }

    .heart-three {
      top: 25%;
      right: 8%;
      animation-delay: 2s;
    }

    .heart-four {
      bottom: 12%;
      right: 15%;
      animation-delay: 3s;
    }

    /* ================================
       BIRTHDAY CELEBRATION
    ================================= */

    #birthdayMessage {
      display: none;
      margin-top: 35px;
      animation: birthdayPop 1s ease forwards;
    }

    #birthdayMessage h2 {
      color: #d34f80;
      font-family: Georgia, serif;
      font-size: clamp(2rem, 6vw, 4.5rem);
      font-weight: 900;
      margin-bottom: 10px;
    }

    #birthdayMessage p {
      color: #754858;
      font-family: Arial, sans-serif;
      font-size: 18px;
      font-weight: 600;
    }

    @keyframes birthdayPop {
      0% {
        opacity: 0;
        transform: scale(0.5);
      }

      70% {
        transform: scale(1.1);
      }

      100% {
        opacity: 1;
        transform: scale(1);
      }
    }

    /* ================================
       CONFETTI
    ================================= */

    .confetti {
      position: fixed;
      top: -20px;
      width: 10px;
      height: 18px;
      z-index: 9999;
      pointer-events: none;

      animation:
        confettiFall linear forwards,
        confettiSpin 1s linear infinite;
    }

    @keyframes confettiFall {
      0% {
        transform: translateY(-20px) rotate(0deg);
        opacity: 1;
      }

      100% {
        transform: translateY(110vh) rotate(720deg);
        opacity: 0.9;
      }
    }

    @keyframes confettiSpin {
      from {
        margin-left: 0;
      }

      to {
        margin-left: 15px;
      }
    }

    @keyframes heartbeat {
      0%, 100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.25);
      }
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) rotate(0deg);
      }

      50% {
        transform: translateY(-25px) rotate(8deg);
      }
    }

    /* Mobile */

    @media (max-width: 700px) {

      .birthday-section {
        padding: 30px 15px;
      }

      .birthday-card {
        padding: 45px 18px;
        border-radius: 25px;
      }

      .birthday-card h1 {
        letter-spacing: -2px;
      }

      .date {
        font-size: 13px;
        letter-spacing: 2px;
        margin-bottom: 30px;
      }

      .countdown {
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }

      .time-box {
        min-height: 115px;
        border-radius: 20px;
      }

      .message {
        font-size: 17px;
        line-height: 1.5;
      }

      .floating-heart {
        display: none;
      }

      #birthdayMessage p {
        font-size: 15px;
      }
    }

    @media (max-width: 380px) {

      .birthday-card {
        padding: 35px 12px;
      }

      .time-box {
        min-height: 100px;
      }

      .time-box small {
        font-size: 10px;
        letter-spacing: 2px;
      }
    }

  </style>
</head>

<body>

  <section class="birthday-section">

    <div class="circle one"></div>
    <div class="circle two"></div>
    <div class="circle three"></div>

    <div class="floating-heart heart-one">♡</div>
    <div class="floating-heart heart-two">♥</div>
    <div class="floating-heart heart-three">♡</div>
    <div class="floating-heart heart-four">♥</div>

    <div class="birthday-card">

      <div class="small-title">
        Lord am grateful for another year
      </div>

      <h1>
        Happy <span>Birthday Gem</span>
      </h1>

      <div class="date">
        NOVEMBER 03 • 2026
      </div>

      <!-- COUNTDOWN -->

      <div class="countdown" id="countdown">

        <div class="time-box">
          <span id="days">00</span>
          <small>Days</small>
        </div>

        <div class="time-box">
          <span id="hours">00</span>
          <small>Hours</small>
        </div>

        <div class="time-box">
          <span id="minutes">00</span>
          <small>Minutes</small>
        </div>

        <div class="time-box">
          <span id="seconds">00</span>
          <small>Seconds</small>
        </div>

      </div>

      <!-- NORMAL MESSAGE -->

      <p class="message" id="normalMessage">
        Counting down to another beautiful chapter
        <span class="heart">♥</span>
      </p>

      <!-- BIRTHDAY MESSAGE -->

      <div id="birthdayMessage">

        <h2>
          🎉 HAPPY BIRTHDAY! 🎂
        </h2>

        <p>
          Welcome to another beautiful chapter of your life, Gem. 💕
        </p>

      </div>

    </div>

  </section>


  <script>

    /* ==================================
       BIRTHDAY DATE
    ================================== */

    const birthday =
      new Date("November 3, 2026 00:00:00").getTime();


    /* ==================================
       COUNTDOWN
    ================================== */

    function countdown() {

      const now = new Date().getTime();

      const difference = birthday - now;


      /* Birthday has arrived */

      if (difference <= 0) {

        document.getElementById("days").textContent = "00";
        document.getElementById("hours").textContent = "00";
        document.getElementById("minutes").textContent = "00";
        document.getElementById("seconds").textContent = "00";


        /* Hide normal message */

        document.getElementById("normalMessage").style.display =
          "none";


        /* Show birthday message */

        document.getElementById("birthdayMessage").style.display =
          "block";


        /* Start confetti */

        launchConfetti();


        return;
      }


      const days = Math.floor(
        difference / (1000 * 60 * 60 * 24)
      );


      const hours = Math.floor(
        (difference / (1000 * 60 * 60)) % 24
      );


      const minutes = Math.floor(
        (difference / (1000 * 60)) % 60
      );


      const seconds = Math.floor(
        (difference / 1000) % 60
      );


      document.getElementById("days").textContent =
        String(days).padStart(2, "0");

      document.getElementById("hours").textContent =
        String(hours).padStart(2, "0");

      document.getElementById("minutes").textContent =
        String(minutes).padStart(2, "0");

      document.getElementById("seconds").textContent =
        String(seconds).padStart(2, "0");

    }


    /* ==================================
       CONFETTI FUNCTION
    ================================== */

    let confettiStarted = false;


    function launchConfetti() {

      /* Prevent it from repeatedly creating confetti */

      if (confettiStarted) return;

      confettiStarted = true;


      const confettiColors = [
        "#d85d89",
        "#f3a6bd",
        "#f7d7c4",
        "#8f3157",
        "#ffffff",
        "#e889a9",
        "#f5c2d2"
      ];


      /* Create 180 confetti pieces */

      for (let i = 0; i < 180; i++) {

        const confetti =
          document.createElement("div");


        confetti.classList.add("confetti");


        /* Random horizontal position */

        confetti.style.left =
          Math.random() * 100 + "vw";


        /* Random size */

        const width =
          Math.random() * 8 + 5;

        const height =
          Math.random() * 15 + 8;


        confetti.style.width =
          width + "px";

        confetti.style.height =
          height + "px";


        /* Random color */

        confetti.style.backgroundColor =
          confettiColors[
            Math.floor(
              Math.random() * confettiColors.length
            )
          ];


        /* Random falling speed */

        confetti.style.animationDuration =
          Math.random() * 3 + 3 + "s";


        /* Random delay */

        confetti.style.animationDelay =
          Math.random() * 2 + "s";


        /* Random shape */

        confetti.style.borderRadius =
          Math.random() > 0.5
            ? "50%"
            : "2px";


        document.body.appendChild(confetti);


        /* Remove after animation */

        setTimeout(() => {

          confetti.remove();

        }, 7000);

      }


      /* Keep celebrating with smaller bursts */

      setTimeout(() => {

        confettiStarted = false;

        launchConfetti();

      }, 8000);

    }


    /* Start countdown */

    countdown();


    /* Update every second */

    setInterval(countdown, 1000);

  </script>

</body>
</html>
